    <rect x="330" y="150" width="500" height="330" rx="18" fill="url(#win)" stroke="#5a4390" stroke-width="4"/>
    <rect x="330" y="150" width="500" height="52" rx="18" fill="#3c2a6e"/>
    <rect x="330" y="184" width="500" height="18" fill="#3c2a6e"/>
    <circle cx="368" cy="176" r="8" fill="#f2a9d4"/>
    <circle cx="396" cy="176" r="8" fill="#ffd76e"/>
    <circle cx="424" cy="176" r="8" fill="#8bd0f0"/>
    <!-- 代码行 -->
    <g stroke-linecap="round" stroke-width="14">
      <line x1="372" y1="250" x2="472" y2="250" stroke="#f2a9d4"/>
      <line x1="492" y1="250" x2="560" y2="250" stroke="#8bd0f0"/>
      <line x1="396" y1="292" x2="540" y2="292" stroke="#c9b6ff"/>
      <line x1="564" y1="292" x2="640" y2="292" stroke="#ffd76e"/>
      <line x1="420" y1="334" x2="500" y2="334" stroke="#8bd0f0"/>
      <line x1="520" y1="334" x2="700" y2="334" stroke="#f2a9d4"/>
      <line x1="396" y1="376" x2="450" y2="376" stroke="#ffd76e"/>
