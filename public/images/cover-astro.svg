      <stop offset="1" stop-color="#261a4e"/>
    </linearGradient>
    <mask id="moon2">
      <circle cx="985" cy="130" r="46" fill="#fff"/>
      <circle cx="1008" cy="114" r="42" fill="#000"/>
    </mask>
  </defs>

  <rect width="1152" height="648" fill="url(#sky2)"/>

  <!-- 星星 -->
