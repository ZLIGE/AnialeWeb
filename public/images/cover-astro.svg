<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset="0.5" stop-color="#3f2f7c"/>
      <stop offset="1" stop-color="#a97fd4"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
