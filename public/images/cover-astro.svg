    <path d="M760 110 L763 119 L772 122 L763 125 L760 134 L757 125 L748 122 L757 119 Z" opacity="0.85"/>
    <path d="M480 150 L483 159 L492 162 L483 165 L480 174 L477 165 L471 162 L477 159 Z" opacity="0.7"/>
  </g>

  <!-- 弯月 -->
