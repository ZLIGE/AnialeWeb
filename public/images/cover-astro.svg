    <circle cx="90" cy="70" r="2.2" opacity="0.9"/>
    <circle cx="240" cy="120" r="1.6" opacity="0.65"/>
    <circle cx="400" cy="55" r="2" opacity="0.85"/>
    <circle cx="560" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="700" cy="45" r="1.8" opacity="0.8"/>
    <circle cx="850" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="1080" cy="220" r="1.8" opacity="0.8"/>
    <circle cx="150" cy="250" r="1.5" opacity="0.5"/>
    <circle cx="620" cy="200" r="1.4" opacity="0.5"/>
    <circle cx="920" cy="60" r="1.6" opacity="0.7"/>
  </g>
  <g fill="#fff">
